name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:sitemap
      - run: npm run check:llms
      - run: npm run check:kaomoji-catalog
      - run: npm run check:kaomoji-seo
      - run: npm run check:aeo
      - run: npm run check:google-policy
      - run: npm run lint
      - run: npm run build
