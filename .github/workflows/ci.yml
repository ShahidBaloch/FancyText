name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, SEO checks, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: SEO plumbing (cannibalization, content-uniqueness, ads, sitemap)
        run: npm run check:seo

      - name: Production build
        run: npm run build
        env:
          # Next.js may read env at build time; keep CI deterministic.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: SERP specimen in pre-rendered HTML
        run: npm run check:serp-specimen-html
