name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, SEO checks, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: SEO plumbing (cannibalization, content-uniqueness, ads, sitemap)
        run: npm run check:seo

      - name: Kaomoji catalog, SEO, AEO, Google policy
        run: npm run check:kaomoji-catalog && npm run check:kaomoji-seo && npm run check:aeo && npm run check:google-policy

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: SERP specimen in pre-rendered HTML
        run: npm run check:serp-specimen-html

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Performance budgets (production server)
        run: |
          npm run start &
          for i in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:3000/" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf "http://127.0.0.1:3000/" > /dev/null || (echo "Server failed to start" && exit 1)
          npm run check:perf
        env:
          PORT: "3000"

      - name: E2E + accessibility smoke
        run: npm run test:e2e
        env:
          PORT: "3000"
          CI: "true"
